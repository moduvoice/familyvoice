[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familyvoice"
version = "0.1.0"
description = "Enrollment-free, ask-free household speaker recognition and voice-addressed message relay"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "onnxruntime>=1.17", "huggingface_hub>=0.20"]

[project.optional-dependencies]
device = ["onnx>=1.15"]      # FV_PROFILE=device builds an int8 copy of the model on first use
dev = ["soundfile"]

[tool.setuptools]
packages = ["familyvoice"]

[tool.setuptools.package-data]
familyvoice = ["thresholds/*.json"]
